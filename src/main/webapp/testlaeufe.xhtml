<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">

    <ui:define name="titel">Testläufe</ui:define>

    <ui:define name="inhalt">
        <h:form id="testlaufForm">
            <p:panel header="Neuen Testlauf anlegen">
                <h:messages globalOnly="true" styleClass="info"/>
                <h:panelGrid columns="3" columnClasses="label,feld,meldung">
                    <h:outputLabel value="Bezeichnung:" for="bezeichnung"/>
                    <h:inputText id="bezeichnung" size="60" label="Bezeichnung" required="true"
                                 value="#{testlaufController.testlauf.bezeichnung}">
                        <f:validateLength minimum="3" maximum="100"/>
                    </h:inputText>
                    <h:message for="bezeichnung" styleClass="error"/>

                    <h:outputLabel value="Startdatum:" for="startdatum"/>
                    <p:calendar id="startdatum" label="Startdatum" required="true" showOn="button"
                                pattern="dd.MM.yyyy" locale="de"
                                value="#{testlaufController.testlauf.startdatum}"/>
                    <h:message for="startdatum" styleClass="error"/>

                    <h:outputText value=""/>
                    <p:commandButton value="Testlauf anlegen" action="#{testlaufController.speichern()}"
                                     ajax="false"/>
                    <h:outputText value=""/>
                </h:panelGrid>
            </p:panel>
        </h:form>

        <h:form id="testlaufListeForm">
            <p:dataTable value="#{testlaufController.testlaeufe}" var="tl"
                         emptyMessage="Noch keine Testläufe angelegt." styleClass="liste">
                <f:facet name="header">Angelegte Testläufe</f:facet>
                <p:column sortBy="#{tl.id}" style="width: 5rem">
                    <f:facet name="header">Nr</f:facet>
                    <h:outputText value="#{tl.id}"/>
                </p:column>
                <p:column sortBy="#{tl.bezeichnung}">
                    <f:facet name="header">Bezeichnung</f:facet>
                    <h:outputText value="#{tl.bezeichnung}"/>
                </p:column>
                <p:column sortBy="#{tl.startdatum}">
                    <f:facet name="header">Startdatum</f:facet>
                    <h:outputText value="#{tl.startdatum}">
                        <f:convertDateTime pattern="dd.MM.yyyy"/>
                    </h:outputText>
                </p:column>
                <p:column style="width: 14rem">
                    <f:facet name="header">Aktion</f:facet>
                    <h:commandLink value="Testfälle zuordnen" action="#{testlaufController.zuordnen(tl)}"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
